<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Catálogo de Móveis</title>

  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================
       CABEÇALHO
       ========================= -->

  <header class="cabecalho">

    <div class="informacoes">

      <h1>
        <span>Catálogo</span>
        <span>de Móveis</span>
      </h1>

      <p class="subtitulo">
        Qualidade, conforto e estilo para transformar seu ambiente.
      </p>

      <div class="destaques">

        <div>
          <i class="fa-solid fa-couch"></i>
          Qualidade
        </div>

        <div>
          <i class="fa-solid fa-house"></i>
          Conforto
        </div>

        <div>
          <i class="fa-solid fa-star"></i>
          Estilo
        </div>

      </div>

    </div>


    <div class="logo">

      <img
        src="imagens/logo.png"
        alt="Logo"
      >

    </div>

  </header>



  <!-- =========================
       CATÁLOGO
       ========================= -->

  <main class="catalogo">

    <img
      src="imagens/logo-catalogo.png"
      alt="Catálogo de Móveis"
      class="logo-catalogo"
    >


    <h2>Catálogo de Móveis</h2>


    <!-- =========================
         BUSCA
         ========================= -->

    <div class="busca-produtos">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        type="text"
        id="campo-busca"
        placeholder="Pesquisar por nome do produto..."
        autocomplete="off"
      >

    </div>


    <!-- =========================
         FILTROS
         ========================= -->

    <div class="filtros">

      <button
        class="filtro ativo"
      >
        Todos
      </button>

      <button
        class="filtro"
      >
        Sofás
      </button>

      <button
        class="filtro"
      >
        Roupeiros
      </button>

      <button
        class="filtro"
      >
        Cômodas
      </button>

      <button
        class="filtro"
      >
        Cozinhas
      </button>

      <button
        class="filtro"
      >
        Mesas
      </button>

      <button
        class="filtro"
      >
        Painéis/Racks
      </button>

      <button
        class="filtro"
      >
        Camas/Colchões/Box
      </button>


   <!-- =========================
     ORDENAÇÃO POR PREÇO
     ========================= -->

<button
  class="ordenacao"
  id="ordenar-preco"
  type="button"
  title="Ordenar por preço"
  aria-label="Alternar ordenação por preço"
>
  <span>↑</span><span>↓</span>
</button>

    </div>


    <!-- =========================
         PRODUTOS
         ========================= -->

    <div id="lista-produtos"></div>


    <!-- =========================
         PAGINAÇÃO
         ========================= -->

    <div id="paginacao"></div>

  </main>



  <!-- =========================
       RODAPÉ
       ========================= -->

  <footer class="rodape">

    <div class="rodape-conteudo">

      <h3>
        Catálogo de Móveis
      </h3>

      <p>
        Entre em contato para mais informações.
      </p>

      <p class="copyright">
        © 2026 - Todos os direitos reservados.
      </p>

    </div>

  </footer>



  <!-- =========================
       MODAL DE DETALHES
       ========================= -->

  <div
    class="modal-produto"
    id="modal-produto"
  >

    <div class="modal-conteudo">


      <button
        class="fechar-modal"
        id="fechar-modal"
        type="button"
        aria-label="Fechar"
      >
        ×
      </button>


      <h2 id="modal-nome"></h2>


      <!-- =========================
           GALERIA
           ========================= -->

      <div class="galeria-produto">

        <img
          id="modal-imagem"
          src=""
          alt=""
        >


        <div
          class="modal-miniaturas"
          id="modal-miniaturas"
        ></div>

      </div>


      <!-- =========================
           DESCRIÇÃO
           ========================= -->

      <p id="modal-descricao"></p>


      <!-- =========================
           PREÇO
           ========================= -->

      <p id="modal-preco"></p>


      <!-- =========================
           WHATSAPP
           ========================= -->

      <a
        id="modal-whatsapp"
        class="botao-whatsapp"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >

        <i class="fa-brands fa-whatsapp"></i>

        Tenho interesse

      </a>


    </div>

  </div>



  <!-- =========================
       PRODUTOS
       ========================= -->

  <script src="produtos.js"></script>


  <!-- =========================
       SCRIPT PRINCIPAL
       ========================= -->

  <script src="script.js"></script>


</body>

</html>
