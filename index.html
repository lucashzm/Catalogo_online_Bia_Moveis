<!DOCTYPE html>
<html>
  <head>
    <title>Bia Moveis</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <header class="cabecalho">

      <div class="informacoes">

        <h1>
          <span>Móveis que</span>
          <span>Transformam</span>
        </h1>

        <p class="subtitulo">
          Qualidade, conforto e estilo para o seu lar.
        </p>

        <div class="destaques">
          <div>🚚 <span>Entrega rápida</span></div>
          <div>🏷️ <span>Preço de atacado</span></div>
        </div>

      </div>

      <div class="logo">
        <img src="imagens/Decoralar.png" alt="Decoralar">
      </div>

    </header>


    <section class="catalogo">

      <h2>Catálogo de Móveis</h2>


      <!-- FILTROS -->

      <div class="filtros">

        <button class="filtro ativo">Todos</button>
        <button class="filtro">Sofás</button>
        <button class="filtro">Roupeiros</button>
        <button class="filtro">Cômodas</button>
        <button class="filtro">Cozinhas</button>
        <button class="filtro">Mesas</button>
        <button class="filtro">Painéis/Racks</button>
        <button class="filtro">Camas/Colchões/Box</button>

      </div>


      <!-- OS PRODUTOS SERÃO INSERIDOS AQUI PELO JAVASCRIPT -->

      <div id="lista-produtos"></div>

    </section>


    <script src="produtos.js"></script>
    <script src="script.js"></script>

  </body>
</html>
